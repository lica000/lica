<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>各種座標圖</title>

  <style>
    :root {
      /* 全站基礎色票：頁面背景、文字、卡片、主按鈕、表格等 */
      --bg: #f4eee7;
      --bg-strong: #e9dfd4;
      --surface: #fffdf9;
      --surface-alt: #f8f3ee;
      --card: #fffdf9;
      --card-border: #eadfcf;
      --text: #3b2d25;
      --text-soft: #685a50;
      --line: #e9ddd0;
      --primary: #8a5d3c;
      --primary-strong: #6e472d;
      --button: #f3eadf;
      --tag: #efe2d3;

      /* 座標圖專用色票：格線、軸線、點名、背景、選單 */
      --chart-bg: #ffffff;
      --chart-border: #555555;
      --chart-grid-strong: rgba(0, 0, 0, 0.10);
      --chart-grid-soft: rgba(0, 0, 0, 0.035);
      --chart-axis: rgba(0, 0, 0, 0.25);
      --axis-label-bg: #ffffff;
      --dot-border: #ffffff;
      --label-bg: rgba(255, 255, 255, 0.5);
      --control-border: #cccccc;
      --table-border: #dddddd;
      --picker-bg: #ffffff;
      --picker-border: #cccccc;
      --picker-label-bg: #f0f0f0;
      --danger: #e57373;
      --shadow-warm: rgba(138, 93, 60, 0.08);
    }

    body.theme-blue {
      /* 深藍色主題：整體頁面與座標圖的深色版本 */
      --bg: #edf4fb;
      --bg-strong: #dfeaf7;
      --surface: #ffffff;
      --surface-alt: #f4f8fd;
      --card: #ffffff;
      --card-border: #d7e4f5;
      --text: #1f2a37;
      --text-soft: #4b586a;
      --line: #dfe8f3;
      --primary: #224d7a;
      --primary-strong: #183d62;
      --button: #e7edf6;
      --tag: #dfeaf7;

      /* 深藍主題下的座標圖與互動元件色 */
      --chart-bg: #ffffff;
      --chart-border: #3a5373;
      --chart-grid-strong: rgba(34, 77, 122, 0.12);
      --chart-grid-soft: rgba(34, 77, 122, 0.05);
      --chart-axis: rgba(34, 77, 122, 0.22);
      --axis-label-bg: #ffffff;
      --dot-border: #ffffff;
      --label-bg: rgba(255, 255, 255, 0.6);
      --control-border: #c7d6e5;
      --table-border: #dfe8f3;
      --picker-bg: #ffffff;
      --picker-border: #c7d6e5;
      --picker-label-bg: #edf4fb;
      --danger: #d96d6d;
      --shadow-warm: rgba(34, 77, 122, 0.08);
    }

    body.theme-monochrome {
      /* 黑白主題：簡約灰階版，保留主題辨識 */
      --bg: #f3f3f3;
      --bg-strong: #e8e8e8;
      --surface: #ffffff;
      --surface-alt: #f5f5f5;
      --card: #ffffff;
      --card-border: #d9d9d9;
      --text: #1d1d1d;
      --text-soft: #555555;
      --line: #d6d6d6;
      --primary: #2f2f2f;
      --primary-strong: #171717;
      --button: #ededed;
      --tag: #e9e9e9;

      /* 黑白主題下的座標圖與控制面板色 */
      --chart-bg: #ffffff;
      --chart-border: #2f2f2f;
      --chart-grid-strong: rgba(0, 0, 0, 0.08);
      --chart-grid-soft: rgba(0, 0, 0, 0.04);
      --chart-axis: rgba(0, 0, 0, 0.18);
      --axis-label-bg: #ffffff;
      --dot-border: #ffffff;
      --label-bg: rgba(255, 255, 255, 0.7);
      --control-border: #d4d4d4;
      --table-border: #dcdcdc;
      --picker-bg: #ffffff;
      --picker-border: #d4d4d4;
      --picker-label-bg: #f0f0f0;
      --danger: #c95a5a;
      --shadow-warm: rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-strong) 100%);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .theme-switcher {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .theme-btn {
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
    }

    .theme-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    h1 {
      margin-bottom: 10px;
    }

    h2 {
      margin-top: 0;
    }

    /* 卡片容器色：控制每一個內容區塊的背景、邊框與陰影 */
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px var(--shadow-warm);
    }

    /* 說明文字色：整體內容區的次要文字 */
    .help {
      line-height: 1.7;
      color: var(--text-soft);
    }

    /* ============================================================
  ============================================================
   座標圖
   ============================================================
============================================================ */

    .chart-area {
      width: min(1000px, 100%);
      margin: 25px auto 30px;
    }

    .chart-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    /* 座標圖背景色：整個座標圖的底板、格線與軸線顏色 */
    .chart {
      position: absolute;

      left: 6%;
      right: 6%;
      top: 6%;
      bottom: 6%;

      border: 2px solid var(--chart-border);

      background-image:
        linear-gradient(to right,
          var(--chart-grid-strong) 1px,
          transparent 1px),
        linear-gradient(to bottom,
          var(--chart-grid-strong) 1px,
          transparent 1px),
        linear-gradient(to right,
          var(--chart-grid-soft) 1px,
          transparent 1px),
        linear-gradient(to bottom,
          var(--chart-grid-soft) 1px,
          transparent 1px);

      background-size:
        10% 10%,
        10% 10%,
        5% 5%,
        5% 5%;

      background-color: var(--chart-bg);
    }

    .chart::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      height: 100%;
      background: var(--chart-axis);
    }

    .chart::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background: var(--chart-axis);
    }

    /* ============================================================
   軸名稱
============================================================ */

    /* 軸名稱標籤色：上/下/左/右四個軸名稱的背景與字體 */
    .axis-label {
      position: absolute;

      font-weight: bold;
      font-size: 14px;

      white-space: nowrap;

      z-index: 4;

      background: var(--axis-label-bg);

      padding: 2px 2px;

      border-radius: 4px;
    }

    .axis-top {
      top: 2%;
      left: 50%;
      transform: translateX(-50%);
    }

    .axis-bottom {
      bottom: 0%;
      left: 50%;
      transform: translateX(-50%);
    }

    .axis-left {
      left: 1%;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    .axis-right {
      right: 1%;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    /* ============================================================
   點
============================================================ */

    /* 角色點色：每個角色節點的圓點與外框 */
    .character-dot {
      position: absolute;

      width: 14px;
      height: 14px;

      border-radius: 50%;

      border: 2px solid var(--dot-border);

      box-shadow:
        0 1px 4px rgba(0, 0, 0, 0.35);

      transform:
        translate(-50%, -50%);

      z-index: 3;
    }


    /* ============================================================
   名稱
============================================================ */


    /* 角色名稱標籤色：角色文字背景與顯示窗 */
    .character-name {
      position: absolute;

      white-space: nowrap;

      font-size: 12px;
      font-weight: 500;

      z-index: 5;

      background:
        var(--label-bg);

      padding:
        1px 4px;

      border-radius: 4px;

      pointer-events: none;

      transform:
        translate(-50%, 0);
    }


    /* ============================================================
   軸選擇
============================================================ */

    .axis-selects {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 15px;
    }

    /* 下拉選單色：X/Y 軸選單邊框與內縮 */
    .axis-selects select {
      width: 100%;

      padding: 9px;

      border:
        1px solid var(--control-border);

      border-radius: 8px;

      font-size: 15px;
    }


    /* ============================================================
    ============================================================
   按鈕
   ============================================================
============================================================ */

    /* 通用按鈕色：所有按鈕的預設背景與文字 */
    button {
      border: 0;

      border-radius: 8px;

      padding:
        7px 12px;

      cursor: pointer;

      background: var(--button);
      color: var(--text);
    }

    button:hover {
      filter: brightness(0.96);
    }

    /* 主要操作按鈕色：新增、匯入、匯出等主動操作 */
    .primary {
      background: var(--primary);
      color: white;
    }

    /* 危險操作按鈕色：刪除與警示類別 */
    .danger {
      background: var(--danger);
      color: white;
    }

    .small-btn {
      padding:
        4px 7px;

      font-size: 12px;
    }

    .reverse-btn {
      background: var(--button);
    }


    /* ============================================================
   標籤
============================================================ */

    .tag-filter {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-top: 10px;
    }

    /* 標籤按鈕色：篩選標籤的預設與選中狀態 */
    .tag-button {
      background: var(--button);
      color: var(--text-soft);

      border-radius: 999px;
    }

    .tag-button.selected {
      background: var(--primary);

      color: white;
    }

    .filter-mode {
      margin-top: 10px;
    }

    .filter-mode label {
      margin-right: 12px;
    }


    /* ============================================================
    ============================================================
   表格
   ============================================================
============================================================ */

    .table-wrapper {
      overflow: auto;
      max-height: 310px;
      background: var(--surface);
      min-width: 0;
    }

    .character-table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
      table-layout: auto;
      border-spacing: 0;
    }

    /* 每一格都保留分隔線；表頭保持黏在上方 */
    .character-table th,
    .character-table td {
      border: 1px solid var(--table-border);
      padding: 4px 4px;
      text-align: center;
      white-space: normal;
      line-height: 1.2;
    }

    .character-table thead th {
      position: sticky;
      top: -1px;
      z-index: 3;
      background: var(--bg);
      white-space: nowrap;
      border: 1px solid var(--table-border);
    }

    .character-table input[type="text"],
    .character-table input[type="number"] {
      width: 100%;
      min-width: 0;
      padding: 2px 2px;
      box-sizing: border-box;
      border: 1px solid var(--control-border);
      background: transparent;
      color: var(--text);
      text-align: center;
      font: inherit;
    }

    .name-column {
      width: auto;
      min-width: 3ch;
    }

    .name-cell {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 90px;
    }

    .name-display {
      display: inline-block;
      max-width: 10ch;
      line-height: 1.2;
      text-align: center;
      word-break: break-word;
      overflow-wrap: anywhere;
      white-space: normal;
    }

    .name-edit-btn {
      padding: 4px 4px;
      font-size: 12px;
      border-radius: 6px;
      max-width: 20px;
      line-height: 1.1;
      text-align: center;
      word-break: break-word;
      overflow-wrap: anywhere;
      white-space: normal;
    }

    .control-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 20px;
      padding: 2px 0;
    }

    .control-cell button {
      padding: 4px 8px;
      line-height: 1.1;
      font-size: 12px;
    }

    .tag-list {
      display: flex;
      gap: 6px;
      justify-content: flex-start;
      align-items: center;
      min-height: 22px;
      white-space: nowrap;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--tag);
      color: var(--text-soft);
      border: 0;
      font-size: 12px;
    }

    .tag-pill button {
      padding: 0;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      font-size: 12px;
      line-height: 1;
      background: var(--button);
      color: var(--text);
    }

    .tags-cell {
      min-width: 140px;
      padding-left: 6px;
      padding-right: 6px;
      vertical-align: middle;
    }

    .tag-add-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
      min-width: 50px;
    }

    .tag-add-row input {
      min-width: 50px;
      padding: 5px 3px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--text);
    }

    .tag-add-row button {
      padding: 5px 8px;
      font-size: 12px;
    }


    .axis-add-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .axis-add-row input {
      min-width: 180px;
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--control-border);
      border-radius: 0;
      background: var(--surface-alt);
      color: var(--text);
    }

    .value-cell {
      min-width: 50px;
      padding: 3px 3px;
      vertical-align: middle;
    }

    .value-display {
      display: block;
      min-width: 3.5ch;
      text-align: center;
      padding: 2px 2px 1px;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      color: var(--text);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .value-editor {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 80px;
      flex: 1 1 auto;
    }

    .value-editor input[type="number"] {
      width: 4ch;
      min-width: 4ch;
      max-width: 4ch;
      padding: 2px 0;
      text-align: center;
      border: 1px solid var(--control-border);
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font: inherit;
    }

    .value-editor input[type="range"] {
      width: 60px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
      transform: rotate(-90deg);
      transform-origin: center;
    }


    /* ============================================================
   顏色
============================================================ */

    /*
  不再讓 color-picker 依賴 overflow 容器。
  它會固定在按鈕附近。

  左邊角色的顏色選單往右展開，
  因此不會被表格左邊切掉。
*/

    .color-cell {
      position: relative;
    }

    /* 顏色按鈕色：每個角色顏色選擇的小圓鈕 */
    .color-button {
      width: 30px;
      height: 30px;

      padding: 0;

      border-radius: 50%;

      border:
        2px solid var(--control-border);
    }

    /* 顏色選擇器色：自訂顏色面板與彈出視窗 */
    .color-picker {
      position: fixed;

      z-index: 9999;

      background: var(--picker-bg);

      border:
        1px solid var(--picker-border);

      border-radius: 10px;

      padding: 8px;

      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.15);

      display: none;

      grid-template-columns:
        repeat(6, 30px);

      gap: 6px;

      width: max-content;
    }

    .color-picker.open {
      display: grid;
    }

    .color-option {
      width: 30px;
      height: 30px;

      border-radius: 50%;

      border:
        1px solid var(--table-border);

      padding: 0;

      cursor: pointer;
    }

    .custom-color-label {
      grid-column:
        1 / -1;

      display: flex;

      align-items: center;

      justify-content: center;

      height: 32px;

      border-radius: 6px;

      background: var(--picker-label-bg);

      font-size: 12px;

      cursor: pointer;
    }

    .custom-color-input {
      position: absolute;

      opacity: 0;

      width: 1px;
      height: 1px;
    }

    .hidden-row {
      opacity: 0.45;
    }


    /* ============================================================
   軸管理
============================================================ */

    .axis-row {
      display: grid;

      grid-template-columns:
        1fr auto auto auto;

      gap: 8px;

      align-items: center;

      padding: 8px 0;

      border-bottom:
        1px solid var(--line);
    }

    .axis-info {
      display: flex;

      flex-direction: column;

      gap: 2px;
    }

    .axis-name {
      font-weight: bold;
    }

    .axis-description {
      color: var(--text-soft);

      font-size: 13px;
    }


    /* ============================================================
   匯入匯出
============================================================ */

    textarea {
      width: 100%;

      min-height: 180px;

      padding: 10px;

      border:
        1px solid var(--control-border);

      border-radius: 8px;

      resize: vertical;

      font-family: monospace;

      line-height: 1.6;
    }

    .import-help {
      color: var(--text-soft);

      line-height: 1.7;
    }


    /* ============================================================
   手機
============================================================ */

    @media (max-width: 700px) {

      body {
        padding: 10px;
      }

      .card {
        padding: 14px;
      }

      .axis-selects {
        grid-template-columns:
          1fr;
      }

      /*
    手機仍然維持正方形。
  */

      .chart-wrapper {
        aspect-ratio: 1 / 1;
      }

      .chart {
        left: 8%;
        right: 8%;
        top: 8%;
        bottom: 8%;
      }

      .axis-label {
        position: absolute;

        font-weight: bold;
        font-size: 14px;

        white-space: nowrap;

        z-index: 1;

        background: transparent;

        padding: 2px 5px;

        border-radius: 4px;

        pointer-events: none;
      }

      .character-name {
        position: absolute;

        white-space: nowrap;

        font-size: 12px;
        font-weight: 500;

        z-index: 5;

        background: rgba(255, 255, 255, 0.6);

        padding: 1px 4px;

        border-radius: 4px;

        pointer-events: none;

        transform: translate(-50%, 0);
      }

      .axis-row {
        grid-template-columns:
          1fr auto auto auto;

        gap: 5px;
      }

      .axis-row button {
        padding:
          6px 8px;

        font-size: 12px;
      }

    }
  </style>
</head>


<body>

  <div class="container">

    <h1>各種座標圖</h1>


    <!-- ============================================================
     使用說明
============================================================ -->

    <div class="card">

      <h2>使用說明</h2>

      <div class="help">

        座標軸兩端分別代表 100 與 0；左／上是 100，右／下是 0。<br>

        角色、顏色、座標資料與標籤會保存在目前裝置的瀏覽器中。
        如果要把資料轉移，可以使用文字匯出與匯入。

      </div>

    </div>


    <!-- ============================================================
     座標圖 + 角色資料
============================================================ -->

    <div class="card">

      <h2>座標圖</h2>


      <div class="axis-selects">

        <div>

          <label>X 軸</label>

          <select id="xAxisSelect"></select>

        </div>


        <div>

          <label>Y 軸</label>

          <select id="yAxisSelect"></select>

        </div>

      </div>


      <div class="chart-area">

        <div class="chart-wrapper">

          <div class="axis-label axis-top" id="topLabel">
          </div>

          <div class="axis-label axis-bottom" id="bottomLabel">
          </div>

          <div class="axis-label axis-left" id="leftLabel">
          </div>

          <div class="axis-label axis-right" id="rightLabel">
          </div>


          <div class="chart" id="chart">
          </div>

        </div>

      </div>


      <h3>顯示標籤</h3>


      <div>

        <button class="tag-button selected" id="allTagsButton" onclick="clearTagFilter()">

          全部

        </button>

      </div>


      <div id="tagFilter" class="tag-filter">
      </div>


      <div class="filter-mode">

        <label>

          <input type="radio" name="filterMode" value="any" checked onchange="renderChart()">

          任一選中的標籤符合

        </label>


        <label>

          <input type="radio" name="filterMode" value="all" onchange="renderChart()">

          所有選中的標籤都符合

        </label>

      </div>


      <hr style="margin:25px 0;">


      <h2>角色資料</h2>


      <div class="table-wrapper" style="margin-top:15px;">

        <table class="character-table">

          <thead>

            <tr id="characterTableHead">
            </tr>

          </thead>

          <tbody id="characterTableBody">
          </tbody>

        </table>

      </div>

    </div>


    <!-- ============================================================
     坐標軸
============================================================ -->

    <div class="card">

      <h2>座標軸</h2>

      <div id="axisList"></div>


      <div class="axis-add-row">
        <input id="newAxisLeftInput" type="text" placeholder="左/上，例如：怪人">
        <input id="newAxisRightInput" type="text" placeholder="右/下，例如：常識人">
        <button class="primary" type="button"
          onclick="addAxis(document.getElementById('newAxisLeftInput').value, document.getElementById('newAxisRightInput').value)">
          ＋新增座標軸
        </button>
      </div>

    </div>


    <!-- ============================================================
     常用坐標軸
============================================================ -->

    <div class="card">

      <h2>常用坐標軸</h2>

      <div id="commonAxes"></div>

    </div>


    <!-- ============================================================
     匯入
============================================================ -->

    <div class="card">

      <h2>文字匯入</h2>


      <div class="import-help">

        第一列是欄位名稱，第一欄是名稱，後面依序填各座標軸的 0～100 數值。<br>

        標籤放在最後，以 <b>#</b> 開頭。<br>

        欄位之間用空格分隔。<br><br>


        例如：

        <pre>角色 光/暗 攻/受 常識人/怪人 老/幼稚
角色A 100 100 30 25 #孩子 #人類
角色B 45 0 100 10 #推角 </pre>

      </div>


      <textarea id="importText" placeholder="把文字資料貼在這裡">
</textarea>


      <br><br>


      <button class="primary" onclick="importData()">

        匯入資料

      </button>

    </div>


    <!-- ============================================================
     匯出
============================================================ -->

    <div class="card">

      <h2>文字匯出</h2>


      <button class="primary" onclick="generateExport()">

        產生匯出文字

      </button>


      <button onclick="copyExport()">

        複製匯出文字

      </button>


      <textarea id="exportText" readonly placeholder="按下「產生匯出文字」後會出現在這裡">
</textarea>

    </div>

  </div>

  <div class="theme-switcher" style="margin-top: 20px;">
    <button class="theme-btn active" data-theme="warm" type="button">奶茶色</button>
    <button class="theme-btn" data-theme="blue" type="button">深藍色</button>
    <button class="theme-btn" data-theme="monochrome" type="button">黑白</button>
  </div>

  <script>

    /* ============================================================
       資料
    ============================================================ */

    const STORAGE_KEY =
      "coordinate_chart_data_v3";


    const defaultColors = [

      "#E57373",
      "#EF9A9A",
      "#FFB74D",
      "#FFD54F",
      "#FFF176",
      "#AED581",
      "#81C784",
      "#4DB6AC",
      "#4DD0E1",
      "#64B5F6",
      "#7986CB",
      "#9575CD",
      "#BA68C8",
      "#F06292",
      "#A1887F",
      "#90A4AE",
      "#78909C",
      "#546E7A"

    ];


    let data =
      loadData();


    let selectedTags = [];


    /* ============================================================
       預設資料
    ============================================================ */

    function createDefaultData() {

      const x = {

        id: makeId(),

        leftTop: "光",

        rightBottom: "暗"

      };


      const y = {

        id: makeId(),

        leftTop: "攻",

        rightBottom: "受"

      };


      const sampleCharacters = [
        {
          id: makeId(),
          name: "主角",
          color: "#E57373",
          tags: ["正義", "熱血"],
          hidden: false,
          values: {
            [x.id]: 78,
            [y.id]: 66
          }
        },
        {
          id: makeId(),
          name: "反派",
          color: "#7986CB",
          tags: ["邪惡", "冷靜"],
          hidden: false,
          values: {
            [x.id]: 26,
            [y.id]: 42
          }
        },
        {
          id: makeId(),
          name: "常識人",
          color: "#81C784",
          tags: ["普通", "隊友"],
          hidden: false,
          values: {
            [x.id]: 55,
            [y.id]: 48
          }
        }
      ];


      return {

        axes: [
          x,
          y
        ],

        characters: sampleCharacters,

        settings: {

          xAxisId: x.id,

          yAxisId: y.id

        }

      };

    }


    /* ============================================================
       儲存
    ============================================================ */

    function loadData() {

      try {

        const saved =
          localStorage.getItem(
            STORAGE_KEY
          );


        if (saved) {

          const parsed =
            JSON.parse(saved);


          if (
            parsed.axes &&
            parsed.characters &&
            parsed.settings
          ) {

            if (
              !Array.isArray(parsed.characters) ||
              parsed.characters.length === 0 ||
              !Array.isArray(parsed.axes) ||
              parsed.axes.length === 0
            ) {

              const defaultData = createDefaultData();
              localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
              return defaultData;

            }


            parsed.characters.forEach(
              character => {

                if (
                  !Array.isArray(
                    character.tags
                  )
                ) {

                  character.tags = [];

                }


                if (
                  typeof character.hidden !==
                  "boolean"
                ) {

                  character.hidden = false;

                }

              }
            );


            return parsed;

          }

        }

      }
      catch (error) {

        console.error(error);

      }


      return createDefaultData();

    }


    function saveData() {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
      );

    }


    /* ============================================================
       ID
    ============================================================ */

    function makeId() {

      return Date.now().toString(36) +
        Math.random()
          .toString(36)
          .slice(2);

    }


    /* ============================================================
       軸
    ============================================================ */

    function getAxis(id) {

      return data.axes.find(
        axis => axis.id === id
      );

    }


    function getXAxis() {

      return getAxis(
        data.settings.xAxisId
      );

    }


    function getYAxis() {

      return getAxis(
        data.settings.yAxisId
      );

    }


    /* ============================================================
       全部重新繪製
    ============================================================ */

    function renderAll() {

      renderAxisSelects();

      renderAxisList();

      renderCommonAxes();

      renderCharacterTable();

      renderTagFilter();

      renderChart();

    }


    /* ============================================================
       軸選擇
    ============================================================ */

    function renderAxisSelects() {

      const xSelect =
        document.getElementById(
          "xAxisSelect"
        );


      const ySelect =
        document.getElementById(
          "yAxisSelect"
        );


      xSelect.innerHTML = "";

      ySelect.innerHTML = "";


      data.axes.forEach(
        axis => {

          const optionX =
            document.createElement(
              "option"
            );


          optionX.value =
            axis.id;


          optionX.textContent =
            `${axis.leftTop} / ${axis.rightBottom}`;


          xSelect.appendChild(
            optionX
          );


          const optionY =
            document.createElement(
              "option"
            );


          optionY.value =
            axis.id;


          optionY.textContent =
            `${axis.leftTop} / ${axis.rightBottom}`;


          ySelect.appendChild(
            optionY
          );

        }
      );


      xSelect.value =
        data.settings.xAxisId;


      ySelect.value =
        data.settings.yAxisId;


      xSelect.onchange =
        function () {

          data.settings.xAxisId =
            this.value;

          saveData();

          renderChart();

        };


      ySelect.onchange =
        function () {

          data.settings.yAxisId =
            this.value;

          saveData();

          renderChart();

        };

    }


    /* ============================================================
       座標圖
    ============================================================ */

    function renderChart() {

      const chart =
        document.getElementById("chart");

      chart.innerHTML = "";

      const xAxis = getXAxis();
      const yAxis = getYAxis();

      if (!xAxis || !yAxis)
        return;

      document.getElementById("topLabel").textContent =
        yAxis.leftTop;

      document.getElementById("bottomLabel").textContent =
        yAxis.rightBottom;

      document.getElementById("leftLabel").textContent =
        xAxis.leftTop;

      document.getElementById("rightLabel").textContent =
        xAxis.rightBottom;


      const visibleCharacters =
        getFilteredCharacters();


      /*
        只有「X、Y 都完全相同」才視為重疊。
      */

      const positionGroups = {};

      visibleCharacters.forEach(character => {

        if (character.hidden)
          return;

        const x =
          Number(character.values[xAxis.id]);

        const y =
          Number(character.values[yAxis.id]);

        if (
          Number.isNaN(x) ||
          Number.isNaN(y)
        )
          return;

        const key = `${x},${y}`;

        if (!positionGroups[key]) {
          positionGroups[key] = [];
        }

        positionGroups[key].push(character);

      });


      /*
        用 SVG 畫名字與點之間的連接線。
        SVG 跟著整個 chart 一起縮放，
        所以線的位置會跟著座標點正確移動。
      */

      const svg =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg"
        );

      svg.setAttribute(
        "width",
        "100%"
      );

      svg.setAttribute(
        "height",
        "100%"
      );

      svg.setAttribute(
        "viewBox",
        "0 0 100 100"
      );

      svg.style.position = "absolute";
      svg.style.left = "0";
      svg.style.top = "0";
      svg.style.width = "100%";
      svg.style.height = "100%";
      svg.style.pointerEvents = "none";
      svg.style.overflow = "visible";
      svg.style.zIndex = "2";

      chart.appendChild(svg);


      visibleCharacters.forEach(character => {

        if (character.hidden)
          return;


        const x =
          Number(character.values[xAxis.id]);

        const y =
          Number(character.values[yAxis.id]);


        if (
          Number.isNaN(x) ||
          Number.isNaN(y)
        )
          return;


        /*
          左 / 上 = 100
          右 / 下 = 0
        */

        const left = 100 - x;
        const top = 100 - y;


        /*
          先畫點
        */

        const dot =
          document.createElement("div");

        dot.className =
          "character-dot";

        dot.style.left =
          `${left}%`;

        dot.style.top =
          `${top}%`;

        dot.style.backgroundColor =
          character.color;

        dot.title =
          character.name;

        chart.appendChild(dot);


        /*
          找出完全相同座標的角色
        */

        const key =
          `${x},${y}`;

        const group =
          positionGroups[key];

        const index =
          group.indexOf(character);


        /*
          一般情況：
          名字就在自己的點下面。
        */

        let offsetX = 0;
        let offsetY = 10;


        /*
          只有完全重疊才移開。
        */

        if (group.length > 1) {

          const offsets = [

            [-28, 10],
            [28, 10],

            [-28, 28],
            [28, 28],

            [-56, 10],
            [56, 10],

            [-56, 28],
            [56, 28],

            [-84, 10],
            [84, 10],

            [-84, 28],
            [84, 28]

          ];


          const offset =
            offsets[
            index % offsets.length
            ];


          offsetX =
            offset[0];

          offsetY =
            offset[1];


          /*
            因為名字被移開，
            畫一條線連回原本的座標點。
    
            SVG viewBox 是 0～100，
            所以直接使用百分比座標。
          */

          const line =
            document.createElementNS(
              "http://www.w3.org/2000/svg",
              "line"
            );


          /*
            線的終點是角色座標點
          */

          line.setAttribute(
            "x1",
            left
          );

          line.setAttribute(
            "y1",
            top
          );


          /*
            線的另一端是移開後的名字位置
          */

          /*
            這裡把 px 偏移換算成大約的 viewBox 位移。
            讓線能跟著圖表縮放。
          */

          const rect =
            chart.getBoundingClientRect();

          const pxToPercent =
            100 / rect.width;


          const labelX =
            left +
            offsetX * pxToPercent;

          const labelY =
            top +
            offsetY * pxToPercent;


          line.setAttribute(
            "x2",
            labelX
          );

          line.setAttribute(
            "y2",
            labelY
          );


          line.setAttribute(
            "stroke",
            character.color
          );

          line.setAttribute(
            "stroke-width",
            "0.35"
          );

          line.setAttribute(
            "stroke-opacity",
            "0.7"
          );


          svg.appendChild(line);

        }


        /*
          名字
        */

        const label =
          document.createElement("div");

        label.className =
          "character-name";

        label.textContent =
          character.name;


        label.style.left =
          `calc(${left}% + ${offsetX}px)`;

        label.style.top =
          `calc(${top}% + ${offsetY}px)`;


        /*
          被移開的名字放在線上方，
          避免線穿過文字。
        */

        if (group.length > 1) {

          label.style.zIndex = "5";

        }


        chart.appendChild(label);

      });

    }


    /* ============================================================
       篩選
    ============================================================ */

    function getFilteredCharacters() {

      if (
        selectedTags.length === 0
      ) {

        return data.characters;

      }


      const mode =
        document.querySelector(
          'input[name="filterMode"]:checked'
        )?.value || "any";


      return data.characters.filter(
        character => {

          const tags =
            character.tags || [];


          if (mode === "all") {

            return selectedTags.every(
              tag =>
                tags.includes(tag)
            );

          }


          return selectedTags.some(
            tag =>
              tags.includes(tag)
          );

        }
      );

    }


    /* ============================================================
       標籤
    ============================================================ */

    function getAllTags() {

      const set =
        new Set();


      data.characters.forEach(
        character => {

          (
            character.tags || []
          ).forEach(
            tag =>
              set.add(tag)
          );

        }
      );


      return Array.from(
        set
      ).sort();

    }


    function renderTagFilter() {

      const container =
        document.getElementById(
          "tagFilter"
        );


      container.innerHTML = "";


      const tags =
        getAllTags();


      tags.forEach(
        tag => {

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "tag-button";


          if (
            selectedTags.includes(tag)
          ) {

            button.classList.add(
              "selected"
            );

          }


          button.textContent =
            `#${tag}`;


          button.onclick =
            function () {

              if (
                selectedTags.includes(tag)
              ) {

                selectedTags =
                  selectedTags.filter(
                    item =>
                      item !== tag
                  );

              }
              else {

                selectedTags.push(tag);

              }


              renderTagFilter();

              renderChart();

            };


          container.appendChild(
            button
          );

        }
      );


      document
        .getElementById(
          "allTagsButton"
        )
        .classList.toggle(
          "selected",
          selectedTags.length === 0
        );

    }


    function clearTagFilter() {

      selectedTags = [];

      renderTagFilter();

      renderChart();

    }


    /* ============================================================
       新增角色
    ============================================================ */

    function addCharacter() {

      const values = {};


      data.axes.forEach(
        axis => {

          values[axis.id] =
            null;

        }
      );


      data.characters.push({

        id: makeId(),

        name: "",

        color:
          defaultColors[
          data.characters.length %
          defaultColors.length
          ],

        values,

        tags: [],

        hidden: false

      });


      saveData();

      renderAll();

    }


    /* ============================================================
       角色表格
    ============================================================ */

    function renderCharacterTable() {

      const head = document.getElementById("characterTableHead");
      const body = document.getElementById("characterTableBody");

      head.innerHTML = "";
      body.innerHTML = "";

      const controlTh = document.createElement("th");
      controlTh.textContent = "";
      controlTh.className = "control-th";
      head.appendChild(controlTh);

      const colorTh = document.createElement("th");
      colorTh.textContent = "顏色";
      head.appendChild(colorTh);

      const nameTh = document.createElement("th");
      nameTh.textContent = "名稱";
      nameTh.classList.add("name-column");
      const longestNameLength = data.characters.reduce((max, character) => Math.max(max, (character.name || "").length), 0);
      const nameWidthChars = Math.min(Math.max(3, longestNameLength), 5);
      nameTh.style.minWidth = `${nameWidthChars}ch`;
      head.appendChild(nameTh);

      data.axes.forEach(axis => {
        const th = document.createElement("th");
        th.textContent = `${axis.leftTop}/${axis.rightBottom}`;
        head.appendChild(th);
      });

      const tagsTh = document.createElement("th");
      tagsTh.textContent = "標籤";
      head.appendChild(tagsTh);

      data.characters.forEach(character => {
        const tr = document.createElement("tr");
        if (character.hidden) tr.classList.add("hidden-row");

        const controlTd = document.createElement("td");
        const controlCell = document.createElement("div");
        controlCell.className = "control-cell";

        const hideButton = document.createElement("button");
        hideButton.className = "small-btn";
        hideButton.textContent = character.hidden ? "○" : "●";
        hideButton.title = character.hidden ? "顯示" : "隱藏";
        hideButton.onclick = function () {
          character.hidden = !character.hidden;
          saveData();
          renderCharacterTable();
          renderChart();
        };

        const deleteButton = document.createElement("button");
        deleteButton.className = "small-btn danger";
        deleteButton.textContent = "×";
        deleteButton.onclick = function () {
          data.characters = data.characters.filter(item => item.id !== character.id);
          saveData();
          renderAll();
        };

        controlCell.appendChild(hideButton);
        controlCell.appendChild(deleteButton);
        controlTd.appendChild(controlCell);
        tr.appendChild(controlTd);

        const colorTd = document.createElement("td");
        colorTd.className = "color-cell";
        const colorButton = document.createElement("button");
        colorButton.className = "color-button";
        colorButton.style.backgroundColor = character.color;
        colorTd.appendChild(colorButton);

        const colorPicker = document.createElement("div");
        colorPicker.className = "color-picker";

        function positionColorPicker() {
          const rect = colorButton.getBoundingClientRect();
          const pickerWidth = 216;
          const pickerHeight = 190;
          let left = rect.left;
          let top = rect.bottom + 6;

          if (left + pickerWidth > window.innerWidth - 8) {
            left = window.innerWidth - pickerWidth - 8;
          }
          if (left < 8) left = 8;
          if (top + pickerHeight > window.innerHeight - 8) {
            top = rect.top - pickerHeight - 6;
          }
          if (top < 8) top = 8;

          colorPicker.style.left = `${left}px`;
          colorPicker.style.top = `${top}px`;
        }

        defaultColors.forEach(color => {
          const option = document.createElement("button");
          option.className = "color-option";
          option.style.backgroundColor = color;
          option.title = color;
          option.onclick = function (event) {
            event.stopPropagation();
            character.color = color;
            saveData();
            colorButton.style.backgroundColor = color;
            colorPicker.classList.remove("open");
            renderChart();
          };
          colorPicker.appendChild(option);
        });

        const customLabel = document.createElement("label");
        customLabel.className = "custom-color-label";
        customLabel.textContent = "自訂顏色";
        const customInput = document.createElement("input");
        customInput.type = "color";
        customInput.className = "custom-color-input";
        customInput.value = character.color;
        customInput.oninput = function (event) {
          event.stopPropagation();
          character.color = this.value;
          colorButton.style.backgroundColor = this.value;
          saveData();
          renderChart();
        };
        customInput.onclick = function (event) {
          event.stopPropagation();
        };
        customLabel.appendChild(customInput);
        colorPicker.appendChild(customLabel);
        document.body.appendChild(colorPicker);

        colorButton.onclick = function (event) {
          event.stopPropagation();
          document.querySelectorAll(".color-picker.open").forEach(picker => picker.classList.remove("open"));
          if (colorPicker.classList.contains("open")) {
            colorPicker.classList.remove("open");
          } else {
            positionColorPicker();
            colorPicker.classList.add("open");
          }
        };

        tr.appendChild(colorTd);

        const nameTd = document.createElement("td");
        const nameCell = document.createElement("div");
        nameCell.className = "name-cell";

        const renderNameView = () => {
          nameCell.innerHTML = "";
          const nameDisplay = document.createElement("span");
          nameDisplay.className = "name-display";
          nameDisplay.textContent = character.name || "未命名";
          const editButton = document.createElement("button");
          editButton.type = "button";
          editButton.className = "small-btn name-edit-btn";
          editButton.textContent = "編輯";
          editButton.onclick = () => renderNameEditor();
          nameCell.appendChild(nameDisplay);
          nameCell.appendChild(editButton);
        };

        const renderNameEditor = () => {
          nameCell.innerHTML = "";
          const nameInput = document.createElement("input");
          nameInput.type = "text";
          nameInput.value = character.name || "";
          nameInput.className = "name-input";
          const confirmBtn = document.createElement("button");
          confirmBtn.type = "button";
          confirmBtn.className = "small-btn primary";
          confirmBtn.textContent = "確認";
          confirmBtn.onclick = () => {
            const cleanName = nameInput.value.trim();
            character.name = cleanName || "";
            saveData();
            renderCharacterTable();
            renderChart();
          };
          nameInput.onkeydown = function (event) {
            if (event.key === "Enter") {
              event.preventDefault();
              confirmBtn.click();
            }
          };
          nameCell.appendChild(nameInput);
          nameCell.appendChild(confirmBtn);
          nameInput.focus();
          nameInput.select();
        };

        renderNameView();
        nameTd.appendChild(nameCell);
        tr.appendChild(nameTd);

        data.axes.forEach(axis => {
          const td = document.createElement("td");
          td.className = "value-cell";

          const valueWrap = document.createElement("div");
          valueWrap.style.display = "flex";
          valueWrap.style.alignItems = "center";
          valueWrap.style.justifyContent = "center";
          valueWrap.style.gap = "6px";

          const valueDisplay = document.createElement("div");
          valueDisplay.className = "value-display";
          valueDisplay.title = "點擊修改數值";

          const valueEditor = document.createElement("div");
          valueEditor.className = "value-editor";

          const numberInput = document.createElement("input");
          numberInput.type = "number";
          numberInput.min = "0";
          numberInput.max = "100";
          numberInput.step = "1";

          const currentValue = character.values[axis.id];
          numberInput.value = currentValue === null || currentValue === undefined ? "" : String(currentValue);

          const rangeInput = document.createElement("input");
          rangeInput.type = "range";
          rangeInput.min = "0";
          rangeInput.max = "100";
          rangeInput.step = "1";

          const syncValue = (nextValue) => {
            if (nextValue === "") {
              character.values[axis.id] = null;
              valueDisplay.textContent = "";
              numberInput.value = "";
              saveData();
              renderChart();
              return;
            }

            let number = Number(nextValue);
            if (Number.isNaN(number)) return;

            number = Math.max(0, Math.min(100, number));
            character.values[axis.id] = number;
            valueDisplay.textContent = String(number);
            numberInput.value = String(number);
            rangeInput.value = String(number);
            saveData();
            renderChart();
          };

          const updateDisplay = () => {
            const value = character.values[axis.id];
            if (value === null || value === undefined) {
              valueDisplay.textContent = "";
              numberInput.value = "";
              rangeInput.value = "0";
              return;
            }
            const currentValue = Number(value);
            const safeValue = Number.isNaN(currentValue) ? 0 : currentValue;
            const clampedValue = Math.max(0, Math.min(100, safeValue));
            valueDisplay.textContent = String(clampedValue);
            numberInput.value = String(clampedValue);
            rangeInput.value = String(clampedValue);
          };

          updateDisplay();

          rangeInput.oninput = function () {
            syncValue(this.value);
          };

          numberInput.onchange = function () {
            syncValue(this.value);
          };

          const openSlider = () => {
            valueEditor.style.display = "flex";
            valueDisplay.style.opacity = "0.7";
            rangeInput.focus();
          };

          const closeSlider = () => {
            valueEditor.style.display = "none";
            valueDisplay.style.opacity = "1";
          };

          td.addEventListener("click", function (event) {
            if (event.target === rangeInput) return;
            if (valueEditor.style.display === "flex") {
              closeSlider();
              return;
            }
            openSlider();
          });

          valueEditor.appendChild(numberInput);
          valueEditor.appendChild(rangeInput);
          valueWrap.appendChild(valueDisplay);
          valueWrap.appendChild(valueEditor);
          td.appendChild(valueWrap);
          tr.appendChild(td);
        });

        const tagsTd = document.createElement("td");
        tagsTd.className = "tags-cell";

        const tagWrap = document.createElement("div");
        tagWrap.style.display = "flex";
        tagWrap.style.flexDirection = "column";
        tagWrap.style.alignItems = "flex-start";
        tagWrap.style.gap = "6px";
        tagWrap.style.width = "100%";

        const tagList = document.createElement("div");
        tagList.className = "tag-list";

        const addTag = (tag) => {
          const cleaned = String(tag || "").trim().replace(/^#+/, "").replace(/\s+/g, "");
          if (!cleaned) return;
          const uniqueTags = [...new Set((character.tags || []).concat(cleaned))];
          character.tags = uniqueTags;
          saveData();
          renderCharacterTable();
          renderTagFilter();
          renderChart();
        };

        const allTags = getAllTags();

        (character.tags || []).forEach(tag => {
          const pill = document.createElement("div");
          pill.className = "tag-pill";
          const tagText = document.createElement("span");
          tagText.textContent = `#${tag}`;
          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.textContent = "×";
          removeBtn.title = "移除標籤";
          removeBtn.onclick = function () {
            character.tags = (character.tags || []).filter(item => item !== tag);
            saveData();
            renderCharacterTable();
            renderTagFilter();
            renderChart();
          };

          pill.appendChild(tagText);
          pill.appendChild(removeBtn);
          tagList.appendChild(pill);
        });

        const addRow = document.createElement("div");
        addRow.className = "tag-add-row";

        const tagInput = document.createElement("input");
        tagInput.type = "text";
        tagInput.placeholder = "新增標籤";
        tagInput.setAttribute("list", `tag-list-${character.id}`);

        const tagDatalist = document.createElement("datalist");
        tagDatalist.id = `tag-list-${character.id}`;
        allTags.forEach(tag => {
          const option = document.createElement("option");
          option.value = tag;
          tagDatalist.appendChild(option);
        });

        const tagAddBtn = document.createElement("button");
        tagAddBtn.type = "button";
        tagAddBtn.textContent = "＋";
        tagAddBtn.title = "新增標籤";
        tagAddBtn.onclick = function () {
          addTag(tagInput.value);
          tagInput.value = "";
        };

        tagInput.onkeydown = function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            addTag(this.value);
            this.value = "";
          }
        };

        addRow.appendChild(tagInput);
        addRow.appendChild(tagDatalist);
        addRow.appendChild(tagAddBtn);

        tagWrap.appendChild(addRow);
        tagWrap.appendChild(tagList);
        tagsTd.appendChild(tagWrap);
        tr.appendChild(tagsTd);

        body.appendChild(tr);
      });

      const addCharFooter = document.createElement("tr");
      const addCharTd = document.createElement("td");
      addCharTd.colSpan = head.children.length;
      const addCharacterButton = document.createElement("button");
      addCharacterButton.type = "button";
      addCharacterButton.textContent = "＋";
      addCharacterButton.className = "small-btn primary";
      addCharacterButton.onclick = function () {
        addCharacter();
      };
      addCharTd.appendChild(addCharacterButton);
      addCharFooter.appendChild(addCharTd);
      body.appendChild(addCharFooter);
    }


    /* ============================================================
       坐標軸列表
    ============================================================ */

    function renderAxisList() {
      const container = document.getElementById("axisList");
      container.innerHTML = "";

      data.axes.forEach(axis => {
        const row = document.createElement("div");
        row.className = "axis-row";

        const renderAxisDisplay = () => {
          row.innerHTML = "";

          const info = document.createElement("div");
          info.className = "axis-info";

          const name = document.createElement("div");
          name.className = "axis-name";
          name.textContent = `${axis.leftTop} / ${axis.rightBottom}`;
          info.appendChild(name);

          const description = document.createElement("div");
          description.className = "axis-description";
          description.textContent = `${axis.leftTop} = 100　${axis.rightBottom} = 0`;
          info.appendChild(description);

          row.appendChild(info);

          const editButton = document.createElement("button");
          editButton.textContent = "編輯";
          editButton.onclick = renderAxisEditor;
          row.appendChild(editButton);

          const reverseButton = document.createElement("button");
          reverseButton.className = "reverse-btn";
          reverseButton.textContent = "反轉";
          reverseButton.title = "交換兩端名稱，並反轉所有角色在此軸上的數值";
          reverseButton.onclick = function () {
            const oldLeft = axis.leftTop;
            axis.leftTop = axis.rightBottom;
            axis.rightBottom = oldLeft;

            data.characters.forEach(character => {
              const value = character.values[axis.id];
              if (value !== null && value !== undefined && !Number.isNaN(Number(value))) {
                character.values[axis.id] = 100 - Number(value);
              }
            });

            saveData();
            renderAll();
          };
          row.appendChild(reverseButton);

          const deleteButton = document.createElement("button");
          deleteButton.className = "danger";
          deleteButton.textContent = "刪除";
          deleteButton.onclick = function () {
            if (data.axes.length <= 2) {
              alert("至少需要保留兩個座標軸。");
              return;
            }

            data.axes = data.axes.filter(item => item.id !== axis.id);
            if (data.settings.xAxisId === axis.id) data.settings.xAxisId = data.axes[0].id;
            if (data.settings.yAxisId === axis.id) data.settings.yAxisId = data.axes[1]?.id || data.axes[0].id;
            data.characters.forEach(character => { delete character.values[axis.id]; });

            saveData();
            renderAll();
          };
          row.appendChild(deleteButton);
        };

        const renderAxisEditor = () => {
          row.innerHTML = "";

          const leftInput = document.createElement("input");
          leftInput.type = "text";
          leftInput.value = axis.leftTop;
          leftInput.placeholder = "左/上，例如：怪人";

          const rightInput = document.createElement("input");
          rightInput.type = "text";
          rightInput.value = axis.rightBottom;
          rightInput.placeholder = "右/下，例如：常識人";

          const confirmButton = document.createElement("button");
          confirmButton.type = "button";
          confirmButton.textContent = "確認";
          confirmButton.onclick = function () {
            const left = leftInput.value.trim();
            const right = rightInput.value.trim();
            if (!left || !right) return;
            axis.leftTop = left;
            axis.rightBottom = right;
            saveData();
            renderAll();
          };

          row.appendChild(leftInput);
          row.appendChild(rightInput);
          row.appendChild(confirmButton);

          leftInput.focus();
          leftInput.select();
        };

        renderAxisDisplay();
        container.appendChild(row);
      });
    }


    /* ============================================================
       新增坐標軸
    ============================================================ */

    function addAxis(leftValue = "", rightValue = "") {

      const left = String(leftValue || "").trim();
      const right = String(rightValue || "").trim();

      if (!left || !right) {
        return;
      }

      const axis = {
        id: makeId(),
        leftTop: left,
        rightBottom: right
      };

      data.axes.push(axis);

      data.characters.forEach(character => {
        character.values[axis.id] = null;
      });

      saveData();
      renderAll();
    }


    /* ============================================================
       常用坐標軸
    ============================================================ */

    const commonAxes = [

      ["理性", "感性"],
      ["外向", "內向"],
      ["秩序", "混沌"],
      ["有錢", "沒錢"],
      ["可愛", "性感"],
      ["天才", "努力家"],
      ["主動", "被動"],
      ["直覺", "思考"],
      ["怪人", "常識人"],
      ["夢想家", "務實"],
      ["幼稚", "成熟"],
      ["樂觀", "悲觀"],
      ["溫柔", "冷淡"],
      ["正義", "邪惡"],
      ["自由", "服從"],
      ["理智", "衝動"]

    ];


    function renderCommonAxes() {

      const container =
        document.getElementById(
          "commonAxes"
        );


      container.innerHTML = "";


      commonAxes.forEach(
        pair => {

          const button =
            document.createElement(
              "button"
            );


          button.textContent =
            `${pair[0]} / ${pair[1]}`;


          button.style.margin =
            "4px";


          button.onclick =
            function () {

              const exists =
                data.axes.some(
                  axis =>
                    axis.leftTop ===
                    pair[0] &&
                    axis.rightBottom ===
                    pair[1]
                );


              if (exists)
                return;


              const axis = {

                id: makeId(),

                leftTop:
                  pair[0],

                rightBottom:
                  pair[1]

              };


              data.axes.push(
                axis
              );


              data.characters.forEach(
                character => {

                  character.values[
                    axis.id
                  ] = null;

                }
              );


              saveData();

              renderAll();

            };


          container.appendChild(
            button
          );

        }
      );

    }


    /* ============================================================
       匯入
    ============================================================ */

    function importData() {

      const text =
        document.getElementById(
          "importText"
        ).value.trim();


      if (!text)
        return;


      const lines =
        text
          .split(/\r?\n/)
          .map(
            line =>
              line.trim()
          )
          .filter(
            line =>
              line
          );


      if (
        lines.length < 2
      ) {

        alert(
          "資料格式不完整。"
        );

        return;

      }


      const headers =
        lines[0]
          .split(/\s+/);


      if (
        headers[0] !== "角色"
      ) {

        alert(
          "第一欄必須是「角色」。"
        );

        return;

      }


      const importedAxes = [];


      headers
        .slice(1)
        .forEach(
          header => {

            if (
              header === "標籤" ||
              header.startsWith("#")
            )
              return;


            const parts =
              header.split("/");


            if (
              parts.length !== 2
            )
              return;


            const left =
              parts[0];


            const right =
              parts[1];


            let axis =
              data.axes.find(
                item =>
                  item.leftTop ===
                  left &&
                  item.rightBottom ===
                  right
              );


            if (!axis) {

              axis = {

                id: makeId(),

                leftTop:
                  left,

                rightBottom:
                  right

              };


              data.axes.push(
                axis
              );


              data.characters.forEach(
                character => {

                  character.values[
                    axis.id
                  ] = null;

                }
              );

            }


            importedAxes.push({

              header,

              axis

            });

          }
        );


      lines
        .slice(1)
        .forEach(
          line => {

            const tagMatches =
              line.match(
                /#[^\s#]+/g
              ) || [];


            const cleanLine =
              line
                .replace(
                  /#[^\s#]+/g,
                  ""
                )
                .trim();


            const parts =
              cleanLine.split(/\s+/);


            const name =
              parts.shift();


            if (!name)
              return;


            const character = {

              id: makeId(),

              name,

              color:
                defaultColors[
                data.characters.length %
                defaultColors.length
                ],

              values: {},

              tags:
                tagMatches.map(
                  tag =>
                    tag.slice(1)
                ),

              hidden: false

            };


            data.axes.forEach(
              axis => {

                character.values[
                  axis.id
                ] = null;

              }
            );


            importedAxes.forEach(
              (item, index) => {

                const raw =
                  parts[index];


                if (
                  raw === undefined ||
                  raw === ""
                )
                  return;


                const number =
                  Number(raw);


                if (
                  Number.isNaN(number)
                )
                  return;


                character.values[
                  item.axis.id
                ] =
                  Math.max(
                    0,
                    Math.min(
                      100,
                      number
                    )
                  );

              }
            );


            data.characters.push(
              character
            );

          }
        );


      saveData();

      renderAll();


      document.getElementById(
        "importText"
      ).value = "";

    }


    /* ============================================================
       匯出
    ============================================================ */

    function generateExport() {

      const headers = [

        "角色",

        ...data.axes.map(
          axis =>
            `${axis.leftTop}/${axis.rightBottom}`
        ),

        "標籤"

      ];


      const lines = [

        headers.join(" ")

      ];


      data.characters.forEach(
        character => {

          const values =
            data.axes.map(
              axis => {

                const value =
                  character.values[
                  axis.id
                  ];


                return (
                  value === null ||
                  value === undefined
                )
                  ? ""
                  : value;

              }
            );


          const tags =
            (
              character.tags || []
            )
              .map(
                tag =>
                  `#${tag}`
              );


          lines.push(

            [
              character.name,
              ...values,
              ...tags
            ].join(" ")

          );

        }
      );


      document.getElementById(
        "exportText"
      ).value =
        lines.join("\n");

    }


    /* ============================================================
       複製
    ============================================================ */

    function copyExport() {

      const textarea =
        document.getElementById(
          "exportText"
        );


      if (!textarea.value) {

        generateExport();

      }


      textarea.select();


      navigator.clipboard
        .writeText(
          textarea.value
        )
        .catch(
          () => {

            document.execCommand(
              "copy"
            );

          }
        );

    }


    /* ============================================================
       關閉顏色選單
    ============================================================ */

    document.addEventListener(
      "click",
      function () {

        document
          .querySelectorAll(
            ".color-picker.open"
          )
          .forEach(
            picker => {

              picker.classList.remove(
                "open"
              );

            }
          );

      }
    );


    /*
      捲動或視窗大小改變時，
      如果顏色選單開著就重新定位。
    */

    window.addEventListener(
      "scroll",
      function () {

        document
          .querySelectorAll(
            ".color-picker.open"
          )
          .forEach(
            picker => {

              const button =
                picker._colorButton;


              if (button) {

                const rect =
                  button.getBoundingClientRect();


                picker.style.left =
                  `${Math.max(
                    8,
                    Math.min(
                      rect.left,
                      window.innerWidth -
                      picker.offsetWidth -
                      8
                    )
                  )}px`;

              }

            }
          );

      },
      true
    );


    /* ============================================================
       主題切換
    ============================================================ */

    const THEME_KEY = "coordinate_chart_theme";

    function applyTheme(themeName) {
      const theme = ["warm", "blue", "monochrome"].includes(themeName) ? themeName : "warm";

      document.body.classList.remove("theme-blue", "theme-monochrome");

      if (theme === "blue") {
        document.body.classList.add("theme-blue");
      }

      if (theme === "monochrome") {
        document.body.classList.add("theme-monochrome");
      }

      document.querySelectorAll(".theme-btn").forEach(button => {
        const isActive = button.dataset.theme === theme;
        button.classList.toggle("active", isActive);
      });

      localStorage.setItem(THEME_KEY, theme);
    }

    const savedTheme = localStorage.getItem(THEME_KEY) || "warm";
    applyTheme(savedTheme);

    document.querySelectorAll(".theme-btn").forEach(button => {
      button.addEventListener("click", () => {
        applyTheme(button.dataset.theme);
      });
    });

    /* ============================================================
       初始
    ============================================================ */

    renderAll();

  </script>
